name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # The committed lockfile's advisories against .github/advisories.txt: a new one fails, a listed one that is gone
  # fails until its line is taken off (coolms/.github, npm-advisories.yml).
  advisories:
    uses: coolms/.github/.github/workflows/npm-advisories.yml@develop

  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node names exactly these lines, each from the lockfile's floor (the
        # engines step below checks both), so the matrix is the claim.
        node: ['22', '24', '26']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # engines.node names exactly the Node lines this matrix runs (no open
      # ">=22"), and within each the highest floor any package in the lockfile
      # declares.
      - name: Engines, against the matrix and the lockfile
        run: node .github/scripts/engines-check.mjs --root .

      - name: Typecheck
        run: npm run typecheck

      # Code holds keys only: a key missing from the base catalogue, a call passing text, or a key composed at run
      # time fails here, and the check's self-test proves each of those is caught.
      - name: Messages
        run: npm run i18n:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  boundary:
    name: Zero runtime dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The zero-dependency claim is the reason this package exists, so it is
      # checked rather than promised -- and checked against the INSTALLED tree,
      # not the manifest. Reading `dependencies` back out of package.json only
      # proves the file says what it says; resolving the production tree proves
      # what a consumer would actually download.
      - name: The production dependency tree must be empty
        run: |
          tree=$(npm ls --omit=dev --all --parseable | tail -n +2)
          if [ -n "$tree" ]; then
              echo "This package must ship with no runtime dependencies. Found:"
              echo "$tree"
              exit 1
          fi
          echo "Production tree is empty."

      # A bundler that silently starts resolving outside src/ would ship a
      # dependency the manifest never declares -- invisible to the check above.
      - name: The built bundle must not import anything external
        run: |
          npm run build
          # An import STATEMENT, not any text ending in from": the bundle
          # legitimately contains `key === "from"` and `"data-transition-from"`,
          # and a pattern that stopped at the word matched both.
          if grep -nE '^\s*(import|export)\b[^;]*\bfrom *"[^.]|\bimport\( *"[^.]' dist/index.mjs; then
              echo "dist/index.mjs imports a module outside the package."
              exit 1
          fi
          echo "Bundle resolves entirely within src/."

  # README, a LICENSE matching the manifest, and CHANGELOG (coolms/.github's basic-files.yml), pinned to a commit.
  basic-files:
    uses: coolms/.github/.github/workflows/basic-files.yml@595d36957a135e7d753abe34ca1ce90a0a6f2215
