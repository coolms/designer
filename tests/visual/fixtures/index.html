<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1">
    <title>@coolms/designer visual fixture</title>
    <link rel="stylesheet" href="/src/styles/coolms-designer.css">
    <style>
        /*
         * visual-regression shell. Held deliberately
         * minimal -- the test pins the designer's surface, not
         * any host chrome. The fixed-pixel `#app` rect is what
         * Playwright screenshots; the rest of the page is just
         * the off-screen backdrop.
         *
         * Anti-flicker rules:
         *   - `* { animation: none }` defeats any CSS keyframe
         *     loop that would make screenshots time-dependent.
         *   - `caret-color: transparent` keeps the contenteditable
         *     blinking caret out of pixel diffs.
         *   - System monospace stack on the canvas avoids host-
         *     font-pack drift between dev machines (the Chromium
         *     "monospace" alias resolves to DejaVu Sans Mono on
         *     Linux + Menlo on macOS; the platform-suffix golden
         *     pattern documented in tests/visual/README.md
         *     handles the residue).
         */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont,
                "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
        }
        #app {
            position: absolute;
            inset: 16px;
            background: #ffffff;
            border: 1px solid #d0d0d0;
            display: flex;
            box-sizing: border-box;
            overflow: hidden;
        }
        *, *::before, *::after {
            animation: none !important;
            transition: none !important;
            caret-color: transparent !important;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="/tests/visual/.compiled/main.js"></script>
</body>
</html>
